<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1a12">
<title>SimBaseball - 模擬棒球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1a12; --panel:#132920; --panel2:#1a382a; --edge:#2b4d3a;
  --chalk:#ece7d6; --dim:#93ab9c; --amber:#ffc95c; --clay:#c9764a;
  --good:#8fd08f; --bad:#e2695c; --blue:#7fb3d5;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--sans);font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#16352644 0%,transparent 60%);}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#board{position:sticky;top:0;z-index:20;background:linear-gradient(#173125,#122519);
  border-bottom:2px solid var(--edge);padding:10px 14px 8px;box-shadow:0 6px 18px #0009}
#bd-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#bd-name{font-weight:900;font-size:17px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bd-name small{color:var(--dim);font-weight:500;font-size:12px;margin-left:6px}
#bd-team{color:var(--amber);font-size:12.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#bd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.bd-cell{background:#0d2115;border:1px solid var(--edge);border-radius:6px;padding:4px 6px 3px;text-align:center}
.bd-cell b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--amber);
  text-shadow:0 0 8px #ffc95c55;line-height:1.2}
.bd-cell span{font-size:10px;color:var(--dim);letter-spacing:.15em}
#lamps{display:flex;gap:14px;justify-content:center;margin-top:7px}
.lamp{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.lamp i{width:9px;height:9px;border-radius:50%;background:#243c2e;border:1px solid #35543f;display:inline-block}
.lamp.on{color:var(--chalk)} .lamp.on i{background:var(--amber);box-shadow:0 0 8px var(--amber);border-color:var(--amber)}
#log{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;
  animation:pop .25s ease;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h4{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:6px;
  display:flex;align-items:center;gap:8px}
.card h4::before{content:'';width:8px;height:8px;background:var(--clay);border-radius:2px;transform:rotate(45deg);flex:none}
.card.gold h4::before{background:var(--amber)} .card.bad h4::before{background:var(--bad)}
.card.good h4::before{background:var(--good)} .card.info h4::before{background:var(--blue)}
.card p{font-size:14px} .card p+p{margin-top:4px}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:0 6px;border-radius:4px;
  background:#0d2115;border:1px solid var(--edge);color:var(--amber);margin:0 2px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.hl{color:var(--amber);font-weight:700}
.statline{font-family:var(--mono);font-size:12.5px;color:var(--chalk);background:#0d2115;border:1px dashed var(--edge);
  border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.7}
table.fin{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:6px}
table.fin th,table.fin td{border-bottom:1px solid var(--edge);padding:4px 4px;text-align:right}
table.fin th{color:var(--dim);font-weight:500;letter-spacing:.05em}
table.fin td:first-child,table.fin th:first-child{text-align:left}
.divider{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.4em;padding:6px 0 0}
.yr-head{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.3em;padding:8px 0 0;cursor:pointer;user-select:none}
.yr-head:hover{color:var(--amber)}
.yr-block.collapsed .yr-body{display:none}
.yr-block.collapsed .yr-head::after{content:' ▸'}
.yr-block:not(.collapsed) .yr-head.has-body::after{content:' ▾'}
.divider::before,.divider::after{content:'———'}
#act{position:sticky;bottom:0;z-index:20;background:linear-gradient(#122519ee,#0b1a12);border-top:2px solid var(--edge);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
#act .title{font-size:12px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px;font-weight:700}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid var(--edge);color:var(--chalk);
  font-family:var(--sans);font-size:15px;font-weight:700;border-radius:10px;padding:11px 14px;margin-top:8px;
  cursor:pointer;text-align:left;transition:.15s}
.btn:active{transform:scale(.98)} .btn:hover{border-color:var(--amber)}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:2px}
.btn.main{background:linear-gradient(#2a5038,#1f3f2c);border-color:#3c6a4c;text-align:center}
.btn.warn{border-color:#6a3c3c}
#dice{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.die{width:44px;height:44px;border-radius:9px;background:var(--chalk);color:#12251a;font-family:var(--mono);
  font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -3px 0 #0003;position:relative}
.die::after{content:'';position:absolute;inset:4px;border-radius:6px;border:1.5px dashed #c9764a55}
.die.used{opacity:.22;transform:scale(.9)} .die.active{outline:3px solid var(--amber);outline-offset:2px}
.die.six{color:#b3402f}
.pool{font-family:var(--mono);font-size:15px;color:var(--amber);margin-bottom:10px}
.abrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
  border-radius:8px;padding:7px 10px;margin-top:6px;cursor:pointer;user-select:none}
.abrow:active{background:var(--panel2)}
.abrow .nm{width:74px;font-size:13.5px;font-weight:700;flex:none}
.abrow .bar{flex:1;height:8px;background:#0d2115;border-radius:4px;overflow:hidden}
.abrow .bar i{display:block;height:100%;background:linear-gradient(90deg,#3c6a4c,var(--amber));border-radius:4px;transition:.2s}
.abrow .val{font-family:var(--mono);width:58px;text-align:right;font-size:14px;flex:none}
.abrow .val b{color:var(--good)}
.abrow.capped{opacity:.45}
#act .row2{display:flex;gap:8px}#act .row2 .btn{flex:1;text-align:center}
#start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  background-image:radial-gradient(ellipse 120% 50% at 50% -5%,#1d4630aa,transparent 60%)}
#start .wrap{max-width:560px;margin:0 auto;padding:40px 22px 60px}
#start h1{font-size:34px;font-weight:900;letter-spacing:.08em;line-height:1.25;margin-top:18px}
#start h1 em{font-style:normal;color:var(--amber)}
#start .sub{color:var(--dim);margin:10px 0 26px;font-size:13.5px;letter-spacing:.08em}
.field{margin-top:18px}
.field label{display:block;font-size:12px;letter-spacing:.25em;color:var(--dim);font-weight:700;margin-bottom:8px}
.field input, .field select{width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--chalk);
  font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none}
.field input:focus, .field select:focus{border-color:var(--amber)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--panel);border:1px solid var(--edge);border-radius:10px;color:var(--dim);
  font-family:var(--sans);font-size:14.5px;font-weight:700;padding:11px 4px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--amber);border-color:var(--amber)}
.seedline{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:22px}
.seedline b{color:var(--amber)}
.stitch{width:64px;height:64px;border-radius:50%;background:var(--chalk);position:relative;box-shadow:inset -6px -8px 0 #00000014}
.stitch::before,.stitch::after{content:'';position:absolute;top:8px;bottom:8px;width:18px;
  border:3px dashed #b3402f;border-top:none;border-bottom:none}
.stitch::before{left:8px;border-right:none;border-radius:50% 0 0 50%}
.stitch::after{right:8px;border-left:none;border-radius:0 50% 50% 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{position:relative}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffc95c66;border-radius:1px}
#btn-restart{background:none;border:1px solid #2b4a38;color:#8fae9c;border-radius:8px;
 font-size:14px;line-height:1;padding:4px 8px;margin-left:8px;cursor:pointer;flex:none}
#btn-restart:active{background:#12271b}
#act-toggle{display:block;margin:0 auto -4px;background:#0e2015;border:1px solid #2b4a38;
 border-bottom:none;color:#8fae9c;font-size:11px;padding:3px 14px;border-radius:10px 10px 0 0;cursor:pointer}
#act.collapsed{display:none!important}
</style>
</head>
<body>
<div id="start">
  <div class="wrap">
    <div class="stitch"></div>
    <h1 id="logo-tap">SimBaseball<br><em>模擬棒球</em></h1>
    <div id="ver-badge" style="position:fixed;top:6px;right:8px;font-size:10px;letter-spacing:1px;color:var(--dim);opacity:.55;font-family:monospace;z-index:50;pointer-events:none">v1.3.7</div>
    <p class="sub">高中三年養成 → 選秀・旅日・旅美 → 國際賽 → 衰退與引退。每一顆骰子都算數。</p>
    <div class="field"><label>球員姓名</label><input id="in-name" maxlength="10" placeholder="例如：陳傑憲" value=""></div>
    <div class="field"><label>守位</label>
      <div class="seg" id="seg-pos">
        <button data-v="P" class="on">投手</button><button data-v="C">捕手</button>
        <button data-v="IF">內野手</button><button data-v="OF">外野手</button>
      </div>
    </div>
    <div class="field"><label>選擇高中</label>
      <select id="sel-hs">
        <option value="random">🎲 隨機分發</option>
        <optgroup label="T1 名門強權">
          <option value="平鎮高中">平鎮高中</option>
          <option value="穀保家商">穀保家商</option>
          <option value="普門中學">普門中學</option>
        </optgroup>
        <optgroup label="T2 八強勁旅">
          <option value="高苑工商">高苑工商</option>
          <option value="北科附工">北科附工</option>
          <option value="南英商工">南英商工</option>
          <option value="西苑高中">西苑高中</option>
        </optgroup>
        <optgroup label="T3 地區學校（易觸發小學校之光）">
          <option value="東大體中">東大體中</option>
          <option value="三民高中">三民高中</option>
          <option value="善化高中">善化高中</option>
          <option value="大溪高中">大溪高中</option>
        </optgroup>
      </select>
    </div>
    <button class="btn main" style="margin-top:28px" id="btn-start">開始生涯 ▸ 高一春天</button>
    <p class="seedline">世界種子
      <input id="seed-show" maxlength="24" style="width:120px;background:#0e2015;color:#ffc95c;border:1px solid #2b4a38;border-radius:6px;padding:2px 6px;font-family:inherit;font-size:12px;text-align:center">
      · <a href="#" id="seed-re" style="color:var(--blue)">換一個</a><br>相同種子＋相同設定＝相同人生</p>
  </div>
</div>
<div id="app">
  <header id="board" style="display:none">
    <div id="bd-top"><div id="bd-name"></div><div id="bd-team"></div><span id="bd-tj" style="color:var(--dim);font-size:11px;margin-left:6px;white-space:nowrap"></span><button id="btn-restart" title="重新開始">↺</button></div>
    <div id="bd-grid">
      <div class="bd-cell"><b id="bd-age">16</b><span>年齡</span></div>
      <div class="bd-cell"><b id="bd-year">2026</b><span>年份</span></div>
      <div class="bd-cell"><b id="bd-ovr">30</b><span>綜合</span></div>
      <div class="bd-cell"><b id="bd-sal">0</b><span>生涯薪(萬)</span></div>
    </div>
    <div id="lamps">
      <span class="lamp" id="lp0"><i></i>季初</span>
      <span class="lamp" id="lp1"><i></i>賽季中</span>
      <span class="lamp" id="lp2"><i></i>季末</span>
    </div>
  </header>
  <main id="log"></main>
  <button id="act-toggle" style="display:none">⌄ 收合選項</button>
  <footer id="act" style="display:none"></footer>
</div>
<script>
let SEED = new URLSearchParams(location.search).get('seed') || Math.random().toString(36).slice(2,10);
let _s = 0;
function seedInit(str){ _s = 1779033703; for(let i=0;i<str.length;i++){ _s = Math.imul(_s ^ str.charCodeAt(i), 3432918353); _s = _s<<13 | _s>>>19; } }
function R(){ _s|=0; _s = _s + 0x6D2B79F5 |0; let t = Math.imul(_s ^ _s>>>15, 1|_s); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const chance=p=>R()*100<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function scrollBottom(){ 
  try{ requestAnimationFrame(function(){ window.scrollTo(0, document.body.scrollHeight); }); }
  catch(e){ try{ window.scrollTo(0, document.body.scrollHeight); }catch(_){} }
}
const N0=(sd)=> (R()+R()+R()+R()-2)/2*sd*2; 

const ABL={sta:'體力',vel:'球速',ctl:'控球',brk:'變化球',con:'Contact',pow:'力量',spd:'速度',eye:'選球',rng:'守備範圍',fld:'接球',arm:'臂力',cat:'配球'};
const POS_AB={P:['sta','vel','ctl','brk'],C:['sta','con','pow','spd','eye','rng','fld','arm','cat'],IF:['sta','con','pow','spd','eye','rng','fld','arm'],OF:['sta','con','pow','spd','eye','rng','fld','arm']};
const POSN={P:'投手',C:'捕手',IF:'內野手',OF:'外野手'};
const DPN={SS:'游擊手','2B':'二壘手','3B':'三壘手','1B':'一壘手', CF:'中外野手',RF:'右外野手',LF:'左外野手',DH:'指定打擊',C:'捕手'};

function dpScore(p){ const a=S.ab;
  switch(p){
    case 'SS': return a.rng*0.5 + a.fld*0.3 + a.arm*0.2;
    case '2B': return a.rng*0.45+ a.fld*0.4 + a.arm*0.15;
    case '3B': return a.arm*0.45+ a.fld*0.35+ a.rng*0.2;
    case 'CF': return a.rng*0.55+ a.fld*0.3 + a.arm*0.15;
    case 'RF': return a.arm*0.45+ a.rng*0.35+ a.fld*0.2;
    case 'LF': return a.rng*0.4 + a.fld*0.35+ a.arm*0.25;
    case 'C':  return a.fld*0.4 + a.cat*0.4 + a.arm*0.2;
    case '1B': return a.fld*0.6 + a.rng*0.2 + a.arm*0.2;
    default: return 99;
  }
}
const DP_TH={
  C:  {CPBL1:46, NPB1:54, MLB:60}, SS: {CPBL1:50, NPB1:58, MLB:64}, CF: {CPBL1:49, NPB1:57, MLB:63},
  '2B':{CPBL1:46,NPB1:53, MLB:59}, '3B':{CPBL1:44,NPB1:51, MLB:57}, RF: {CPBL1:43, NPB1:50, MLB:56},
  LF: {CPBL1:41, NPB1:47, MLB:53}, '1B':{CPBL1:36,NPB1:42, MLB:48}};
const DP_BAR={CPBL1:45,NPB1:54,MLB:60};
const DP_MULT={SS:1.15,CF:1.15,C:1.12,'2B':1.05,'3B':1.05,RF:1.05,'1B':1.0,LF:1.0,DH:0.92};
function dpBar(){ return (DP_BAR[S.lv]||0) - (S.age<=21?7:S.age<=24?5:S.age<=26?2:0); }
function dpQual(p){
  if(p==='DH')return true;
  if(!DP_TH[p]||!DP_TH[p][S.lv])return true; 
  return dpScore(p) >= DP_TH[p][S.lv]+(S.age<24?-3 : S.age<26?-1.5 : 0);
}
const DP_RANK={SS:0,CF:0,'2B':1,'3B':2,RF:2,'1B':3,LF:3,DH:4,C:0};
function dpList(){ const q = (S.pos==='IF'?['SS','2B','3B','1B']:['CF','RF','LF','1B']).filter(dpQual); q.push('DH'); return q; }
function dpMult(){ return (S.pos!=='P'&&S.dpos)?(DP_MULT[S.dpos]||1):1; }
function dposReview(cont){
  if(S.stage!=='PRO'||!(S.lv==='CPBL1'||S.lv==='NPB1'||S.lv==='MLB')){ cont(); return; }
  if(S.pos==='C'){ 
    if(!S.dpos)S.dpos='C';
    const cOk=()=>{ const bar=dpBar(), a=S.ab; return a.fld>=bar-6 && a.cat>=bar-4 && a.arm>=bar-2; };
    if(S.dpos==='C'){
      if(cOk()){ cont(); return; }
      const opts=[];
      if(dpQual('1B'))opts.push({t:'移防 一壘手',main:true,s:'薪資係數 ×1.00',f:()=>{S.dpos='1B';card('info','守位調整','捕手裝備收進置物櫃——新球季改守<b class="hl">一壘</b>。');cont();}});
      opts.push({t:'轉任 指定打擊',main:!opts.length,s:'薪資係數 ×0.92',f:()=>{S.dpos='DH';card('info','守位調整','阻殺率成了聯盟笑話，球團決定讓你專心打擊——<b class="hl">DH</b>。');cont();}});
      choose(`守位會議：教練團已經不敢讓你蹲捕（${LV[S.lv].n}標準）`,opts); return;
    }
    if(cOk()){ choose('守位會議：牛棚捕手回報你的接捕又行了',[{t:'重披捕手裝備',main:true,s:'薪資係數 ×1.12',f:()=>{S.dpos='C';card('good','守位調整','面罩戴回來——新球季重新登錄為<b class="hl">捕手</b>。');cont();}},{t:'維持現狀',f:()=>cont()}]); return; }
    if(S.dpos==='1B'&&!dpQual('1B')){ S.dpos='DH'; card('info','守位調整','連一壘都站不住了，新球季登錄為<b class="hl">指定打擊</b>。'); }
    cont(); return; 
  }
  if(S.pos==='P'){ 
    const nr=pitcherRole(), old=S.role; S.role=nr;
    if(old&&old!==nr) card('info','定位調整',`球團季末評估你的體力狀況，新球季將你的角色調整為 <b class="hl">${roleN(nr)}</b>。`);
    else if(!old) card('info','投手定位',`教練團評估你的體力，將你登錄為 <b class="hl">${roleN(nr)}</b>。`);
    if(nr!=='SP'&&S.ab.sta>=50&&!S._closerHint){ S._closerHint=true; card('info','牛棚的另一條路',`你的體力已逼近先發門檻。若你維持不強化體力，未來有機會改造成<b class="hl">終結者</b>。`); }
    cont(); return;
  }
  const q=dpList();
  if(!S.dpos){ S.dpos=q[0]; card('info','守位登錄',`教練團評估後，將你登錄為 <b class="hl">${DPN[S.dpos]}</b>。`); cont(); return; }
  if(dpQual(S.dpos)){
    const best=q[0];
    if(DP_RANK[best]<DP_RANK[S.dpos]){ 
      choose(`守位會議：教練團想把你推上更吃重的位置`,[{t:`升防 ${DPN[best]}`,main:true,s:`薪資係數 ×${(DP_MULT[best]||1).toFixed(2)}`,f:()=>{S.dpos=best;card('good','守位調整',`守備數據說服了所有人——新球季改守 <b class="hl">${DPN[best]}</b>。`);cont();}},{t:`留守 ${DPN[S.dpos]}`,f:()=>cont()}]); return; }
    cont(); return; }

function posLegendPhrase(bucket){ const st=S.stats[bucket]; if(!st||S.pos==='P')return ''; const off=st.H+st.HR*3+st.SB*0.8+st.RBI*0.5+st.BB*0.3, def=Math.max(0,st.DEF||0)*6, share=(off+def)>0?def/(off+def):0, dp=S.dpos||(S.pos==='C'?'C':null), hasGlove=S.honors.some(h=>h.includes('金手套')||h.includes('守備王')); if(!dp||dp==='DH')return ''; const posN=DPN[dp]||''; if(share>=0.34||(hasGlove&&share>=0.22))return `，以${{SS:'最偉大的游擊手',CF:'守備範圍撼動聯盟的中外野手',C:'蹲捕藝術的化身',_:'守備傳奇'}[dp]||('頂尖'+posN)}之姿`; if(hasGlove&&share>=0.12)return `，一位攻守俱佳的${posN}`; return ''; }
function honorScore(bucket){ const lg=LG_N[bucket], champ={CPBL:'中職總冠軍',NPB:'日本一',MLB:'世界大賽冠軍'}[bucket], ace='年度最佳投手'; let sc=0,mvp=0,aceN=0,king=0; S.honors.forEach(h=>{ if(h.includes(champ)){sc+=90;return;} if(h.includes(ace)){sc+=460;aceN++;return;} if(!h.includes(lg))return; if(h.includes('年度MVP')){sc+=420;mvp++;} else if(h.includes('新人王'))sc+=140; else if(h.includes('金手套')){sc+=300;king++;} else if(h.includes('守備王')){sc+=220;king++;} else if(h.includes('王')){sc+=160;king++;} else if(h.includes('明星賽'))sc+=(S.pos==='P'?70:40); }); if(S.traits.franchise)sc+=200; return {sc,mvp,aceN,king}; }
function tierOf(bucket){ const st=S.stats[bucket]; if(!st)return null; const hs=honorScore(bucket), sc=careerScore(st)+hs.sc, th=TIER_TH[bucket]; let i=sc>=th[0]?0:sc>=th[1]?1:sc>=th[2]?2:sc>=th[3]?3:4; if(hs.mvp||hs.aceN)i=Math.min(i,1); else if(hs.king)i=Math.min(i,2); return {i,sc:Math.round(sc),name:LG_N[bucket]+['名人堂','明星球員','每日球員','邊緣球員','一頁過客'][i]}; }
function statTable(bucket){ const st=S.stats[bucket]; if(!st)return ''; let rows; if(S.pos==='P'){ const era=st.IP>0?(st.ER*9/st.IP).toFixed(2):'-', whip=st.IP>0?((st.H+st.BB)/st.IP).toFixed(2):'-'; rows=`<tr><th>Yrs</th><th>G</th><th>IP</th><th>W</th><th>L</th><th>SV</th><th>HLD</th><th>SO</th><th>BB</th><th>ERA</th><th>WHIP</th></tr><tr><td>${st.yr}</td><td>${st.G}</td><td>${fmtIP(st.IP)}</td><td>${st.W}</td><td>${st.L}</td><td>${st.SV||0}</td><td>${st.HLD||0}</td><td>${st.SO}</td><td>${st.BB||0}</td><td>${era}</td><td>${whip}</td></tr>`; }else{ const obpN=st.PA>0?(st.H+st.BB)/st.PA:0, slgN=slgOf(st), avg=st.AB>0?(st.H/st.AB).toFixed(3).replace(/^0/,''):'-', obp=st.PA>0?obpN.toFixed(3).replace(/^0/,''):'-', slg=st.AB>0?slgN.toFixed(3).replace(/^0/,''):'-', ops=st.AB>0?(obpN+slgN).toFixed(3).replace(/^0/,''):'-'; rows=`<tr><th>Yrs</th><th>G</th><th>PA</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>H</th><th>HR</th><th>RBI</th><th>SB</th><th>DEF</th></tr><tr><td>${st.yr}</td><td>${st.G}</td><td>${st.PA}</td><td>${avg}</td><td>${obp}</td><td>${slg}</td><td>${ops}</td><td>${st.H}</td><td>${st.HR}</td><td>${st.RBI}</td><td>${st.SB}</td><td>${st.DEF>0?'+':''}${st.DEF||0}</td></tr>`; } return `<p style="margin-top:8px"><b>${LG_N[bucket]}</b>${st.AS?` · 明星賽 ${st.AS} 度入選`:''}</p><table class="fin">${rows}</table>`; }
function retireScene(tiers){
  let lg=bucketOf(S.lv), bestI=4; ['MLB','NPB','CPBL'].forEach(b=>{ if(tiers[b]&&tiers[b].i<bestI){ bestI=tiers[b].i; } }); let repYr=-1; ['MLB','NPB','CPBL'].forEach(b=>{ if(tiers[b]&&tiers[b].i===bestI){ const yy=S.stats[b]?S.stats[b].yr:0; if(yy>repYr){repYr=yy;lg=b;} } }); const t=tiers[lg], i=t?t.i:4, yr=S.year; let txt='';
  if(lg==='CPBL'){ if(i===0)txt=`引退戰在大巨蛋，四萬人滿場。光榮謝幕。`; else if(i===1)txt=`球團舉辦了感人的引退儀式。`; else if(i===2)txt=`最終戰上場，全場起立鼓掌。`; else txt=`官網宣布引退，球迷留言不捨。`; }
  else if(lg==='NPB'){ if(i<=1)txt=`引退試合，被隊友拋起胴上げ，日媒頭版。`; else if(i===2)txt=`最終戰舉行了簡單的引退儀式。`; else txt=`安靜地離開異鄉，結束旅日。`; }
  else if(lg==='MLB'){ if(i<=1)txt=`主場最終戰 Curtain Call，全美轉播致敬。`; else if(i===2)txt=`球隊致贈紀念球衣，低調引退。`; else txt=`在社群發文 "Thank you, baseball"，默默結束。`; }
  else{ txt=`安靜地收拾球具離開二軍球場。`; }
  card('gold','引退之日',txt);
  const hofs=[], HOF_CFG={CPBL:{n:'中職名人堂',w:5,t:132,lg:'中職'},NPB:{n:'野球殿堂',w:5,t:326,lg:'日職'},MLB:{n:'美國名人堂',w:5,t:389,lg:'大聯盟'}}; let first=false, hLgs=[];
  ['CPBL','NPB','MLB'].forEach(b=>{ const t=tiers[b]; if(!t)return; const cfg=HOF_CFG[b]; if(t.i===0){ const fb=t.sc>=TIER_TH[b][0]*1.2; const by=fb?1:ri(2,6); if(fb)first=true; hLgs.push(cfg.lg); const pct=Math.min(99.1,75+(t.sc-TIER_TH[b][0])/TIER_TH[b][0]*40+R()*6-(by-1)*4); if(!S.hofInfo)S.hofInfo=[]; S.hofInfo.push({lg:cfg.lg,yr:by,pct:Math.max(75,pct).toFixed(1)}); hofs.push(`引退 ${cfg.w} 年後，第 ${by} 年以 ${Math.max(75,pct).toFixed(1)}% 得票率入選<b class="hl">${cfg.n}</b>。${by===1?'<b class="hl">首票入選！</b>':''}`); }else if(t.i===1){ hofs.push(`連續多年入圍${cfg.n}，最高得票 ${(55+R()*17).toFixed(1)}%，遺憾未過門檻。`); } });
  if(first&&!S.traits.legend){ S.traits.legend=true; S.legendLeague=hLgs[0]||''; } if(hofs.length)card('gold','名人堂',hofs.join('<br>')); if(S.traits.legend)card('gold','歷史級球星',`你定義了一個時代。`);
}
function endGame(reason){
  S.done=true; actClear(); divider('生涯終幕'); card('info','引退',reason); let tables='',evals=[],best=99; const tiers={};
  ['MLB','NPB','CPBL','MINOR'].forEach(b=>{ if(S.stats[b]){ tables+=statTable(b); if(b!=='MINOR'){ const t=tierOf(b); tiers[b]=t; evals.push(`<span class="tag">${t.name}</span>`); best=Math.min(best,t.i); } } });
  if(best===99)best=4; retireScene(tiers);
  if((tiers.CPBL&&tiers.CPBL.i===0)||!!S.stats.NPB||!!S.stats.MLB){ if(!S.traits.smallschool&&S.hsTier===3)traitCard('smallschool','小學校之光','出身從不是天花板。'); if(!S.traits.grinder&&(S.potSum0||999)<=(S.pos==='P'?237:469))traitCard('grinder','努力仔','汗水熬成天賦。'); }
  if(S.age<25) card('gold','第二人生',`你離開了棒球，但在另一個領域發光發熱。`);
  if(S.log.length){ const ama=S.log.filter(r=>!r.st), pro=S.log.filter(r=>r.st); if(ama.length)card('','業餘年表',`<table class="fin"><tr><th>年</th><th>齡</th><th style="text-align:left">球隊</th><th style="text-align:left">成績</th></tr>${ama.map(r=>`<tr><td>${r.y}</td><td>${r.age}</td><td style="text-align:left">${r.tm}</td><td style="text-align:left;font-size:11px;${r.inj?'color:var(--bad)':''}">${r.line}</td></tr>`).join('')}</table>`); if(pro.length){ const isP=S.pos==='P'; card('','職業年表',`<table class="fin">${isP?`<tr><th>年</th><th>齡</th><th style="text-align:left">隊</th><th>G</th><th>IP</th><th>W</th><th>L</th><th>SV</th><th>HLD</th><th>SO</th><th>ERA</th></tr>`:`<tr><th>年</th><th>齡</th><th style="text-align:left">隊</th><th>G</th><th>PA</th><th>AVG</th><th>OPS</th><th>HR</th><th>SB</th><th>DEF</th></tr>`}${pro.map(r=>{ const s=r.st||{}; return isP?`<tr style="${r.inj?'color:var(--bad)':''}"><td>${r.y}</td><td>${r.age}</td><td style="text-align:left">${r.tm}</td><td>${s.G}</td><td>${fmtIP(s.IP)}</td><td>${s.W}</td><td>${s.L}</td><td>${s.SV||0}</td><td>${s.HLD||0}</td><td>${s.SO}</td><td>${s.IP>0?(s.ER*9/s.IP).toFixed(2):'-'}</td></tr>`:`<tr style="${r.inj?'color:var(--bad)':''}"><td>${r.y}</td><td>${r.age}</td><td style="text-align:left">${r.tm}</td><td>${s.G}</td><td>${s.PA}</td><td>${s.AB>0?(s.H/s.AB).toFixed(3).replace(/^0/,''):'-'}</td><td>${s.AB>0?(((s.H+s.BB)/s.PA)+slgOf(s)).toFixed(3).replace(/^0/,''):'-'}</td><td>${s.HR}</td><td>${s.SB}</td><td>${s.DEF||0}</td></tr>`;}).join('')}</table>`); } }
  let iT=''; if(S.intlCount>0) iT=`<h4 style="margin:12px 0 4px">中華隊 ${S.intlCount} 屆</h4>`;
  card('','累積數據',(tables||'<p>無職業紀錄</p>')+iT); if(evals.length)card('gold','生涯評價',evals.join(' '));
  const tr=[]; const TN={genius:'天才',iron:'鐵人',glass:'玻璃人',scum:'渣男',late:'大器晚成',disc:'自律狂',academy:'學院派',intlace:'國際賽之鬼',franchise:'神主牌',clutch:'大心臟',phoenix:'浴火重生',onetool:'只會這個',rubber:'橡膠手臂',goldcloth:'黃金聖衣',mrteam:(teamNick(S.mrTeamName||'')||'')+'先生',confidante:'閨中密友',smallschool:'小學校之光',grinder:'努力仔',legend:'歷史傳奇',yips:'失憶症',distract:'外務纏身',cancer:'氣氛大師',ambience:'氣氛大師',thief:'薪水小倫'};
  Object.keys(TN).forEach(k=>{ if(S.traits[k])tr.push(`<span class="tag">${TN[k]}</span>`); });
  card('','檔案',`隱藏：${tr.join(' ')||'無'}<br>生涯薪：<b class="hl">${fmtMoney(Math.round(S.salary))}</b>`);
  
  const sh=document.createElement('div'); sh.className='card'; sh.innerHTML=`<div class="title">分享</div><button class="btn main" id="sh-url">🔗 複製重播連結</button>`; $('log').appendChild(sh);
  sh.querySelector('#sh-url').onclick=e=>{ const u=location.href.split('?')[0]+'?seed='+SEED; if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>e.target.textContent='✅ 已複製'); else prompt('連結：',u); };
  choose('',[{t:'⚾ 新的人生',main:true,f:()=>location.href=location.pathname},{t:'同種子重來',f:()=>location.href=location.pathname+'?seed='+SEED}]);
}

(function(){ const t=$('act-toggle'); if(t)t.onclick=()=>{ $('act').classList.toggle('collapsed'); t.textContent=$('act').classList.contains('collapsed')?'⌃ 展開':'⌄ 收合'; }; })();
let selPos='P'; $('seed-show').value=SEED; $('seed-re').onclick=e=>{e.preventDefault();SEED=Math.random().toString(36).slice(2,10);$('seed-show').value=SEED;};
document.querySelectorAll('#seg-pos button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#seg-pos button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); selPos=b.dataset.v; });

  history.replaceState(null,'','?seed='+encodeURIComponent(SEED)); seedInit(SEED);
  S=newState(nm,selPos,null,hs); S.teamName=function(){ if(!this.orgTeam)return ''; if(this.lv==='MLB')return this.orgTeam; if(LV[this.lv].org==='MiLB')return this.orgTeam+({R:'新人',A1:'1A',A2:'2A',A3:'3A'}[this.lv]); if(this.lv==='CPBL1'||this.lv==='NPB1')return this.orgTeam; return this.orgTeam+'二軍'; };
