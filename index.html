function rSc(ts){let l=buc(S.lv),bI=4;['MLB','NPB','CPBL'].forEach(b=>{if(ts[b]&&ts[b].i<bI)bI=ts[b].i});let rY=-1;['MLB','NPB','CPBL'].forEach(b=>{if(ts[b]&&ts[b].i===bI){const y=S.stats[b]?S.stats[b].yr:0;if(y>rY){rY=y;l=b}}});const t=ts[l],i=t?t.i:4,y=S.year;let tx='';if(l==='CPBL'){if(i===0)tx=`大巨蛋引退戰，四萬人滿場。`;else if(i===1)tx=`感人的引退儀式。`;else if(i===2)tx=`最終戰全場鼓掌。`;else tx=`官網宣布引退。`}else if(l==='NPB'){if(i<=1)tx=`引退試合，胴上げ。`;else if(i===2)tx=`簡單引退儀式。`;else tx=`安靜離開異鄉。`}else if(l==='MLB'){if(i<=1)tx=`Curtain Call，全美致敬。`;else if(i===2)tx=`球隊致贈球衣。`;else tx=`社群發文感謝。`}else tx=`離開二軍。`;card('gold','引退',tx);const hf=[],HC={CPBL:{n:'中職名人堂',w:5,t:132,l:'中職'},NPB:{n:'野球殿堂',w:5,t:326,l:'日職'},MLB:{n:'美國名人堂',w:5,t:389,l:'大聯盟'}};let f=false,hl=[];['CPBL','NPB','MLB'].forEach(b=>{const t=ts[b];if(!t)return;const c=HC[b];if(t.i===0){const fb=t.s>=T_T[b][0]*1.2,by=fb?1:ri(2,6);if(fb)f=true;hl.push(c.l);const p=MN(99.1,75+(t.s-T_T[b][0])/T_T[b][0]*40+R()*6-(by-1)*4);hf.push(`引退 ${c.w} 年後，第 ${by} 年以 ${MX(75,p).toFixed(1)}% 入選<b class="hl">${c.n}</b>。${by===1?'<b class="hl">首票入選！</b>':''}`)}else if(t.i===1)hf.push(`入圍${c.n}，最高 ${(55+R()*17).toFixed(1)}%，未過門檻。`)});if(f&&!S.traits.legend){S.traits.legend=true;S.legendLeague=hl[0]||''}if(hf.length)card('gold','名人堂',hf.join('<br>'));if(S.traits.legend)card('gold','歷史級球星',`定義了時代。`)}
function eG(r){S.done=true;aC();divi('終幕');card('info','引退',r);let tb='',ev=[],b=99;const ts={};['MLB','NPB','CPBL','MINOR'].forEach(x=>{if(S.stats[x]){tb+=sTa(x);if(x!=='MINOR'){const t=tOf(x);ts[x]=t;ev.push(`<span class="tag">${t.n}</span>`);b=MN(b,t.i)}}});if(b===99)b=4;rSc(ts);if((ts.CPBL&&ts.CPBL.i===0)||!!S.stats.NPB||!!S.stats.MLB){if(!S.traits.smallschool&&S.hsTier===3)trC('smallschool','小學校之光','出身非天花板。');if(!S.traits.grinder&&(S.potSum0||999)<=(S.pos==='P'?237:469))trC('grinder','努力仔','汗水熬成天賦。')}if(S.age<25)card('gold','第二人生',`在另一個領域發光。`);if(S.log.length){const am=S.log.filter(x=>!x.st),pr=S.log.filter(x=>x.st);if(am.length)card('','業餘年表',`<table class="fin"><tr><th>年</th><th>齡</th><th style="text-align:left">隊</th><th style="text-align:left">成績</th></tr>${am.map(x=>`<tr><td>${x.y}</td><td>${x.age}</td><td style="text-align:left">${x.tm}</td><td style="text-align:left;font-size:11px;${x.inj?'color:var(--bad)':''}">${x.line}</td></tr>`).join('')}</table>`);if(pr.length){const iP=S.pos==='P';card('','職業年表',`<table class="fin">${iP?`<tr><th>年</th><th>齡</th><th style="text-align:left">隊</th><th>G</th><th>IP</th><th>W</th><th>L</th><th>SV</th><th>HLD</th><th>SO</th><th>ERA</th></tr>`:`<tr><th>年</th><th>齡</th><th style="text-align:left">隊</th><th>G</th><th>PA</th><th>AVG</th><th>OPS</th><th>HR</th><th>SB</th><th>DEF</th></tr>`}${pr.map(x=>{const s=x.st||{};return iP?`<tr style="${x.inj?'color:var(--bad)':''}"><td>${x.y}</td><td>${x.age}</td><td style="text-align:left">${x.tm}</td><td>${s.G}</td><td>${fIP(s.IP)}</td><td>${s.W}</td><td>${s.L}</td><td>${s.SV||0}</td><td>${s.HLD||0}</td><td>${s.SO}</td><td>${s.IP>0?(s.ER*9/s.IP).toFixed(2):'-'}</td></tr>`:`<tr style="${x.inj?'color:var(--bad)':''}"><td>${x.y}</td><td>${x.age}</td><td style="text-align:left">${x.tm}</td><td>${s.G}</td><td>${s.PA}</td><td>${s.AB>0?(s.H/s.AB).toFixed(3).replace(/^0/,''):'-'}</td><td>${s.AB>0?(((s.H+s.BB)/s.PA)+slg(s)).toFixed(3).replace(/^0/,''):'-'}</td><td>${s.HR}</td><td>${s.SB}</td><td>${s.DEF||0}</td></tr>`}).join('')}</table>`)}}let iT='';if(S.intlCount>0)iT=`<h4 style="margin:12px 0 4px">中華隊 ${S.intlCount} 屆</h4>`;card('','數據',(tb||'<p>無紀錄</p>')+iT);if(ev.length)card('gold','評價',ev.join(' '));const tr=[],TN={genius:'天才',iron:'鐵人',glass:'玻璃人',scum:'渣男',late:'大器晚成',disc:'自律狂',academy:'學院派',intlace:'鬼',franchise:'神主牌',clutch:'大心臟',phoenix:'重生',onetool:'工具',rubber:'橡膠',goldcloth:'聖衣',mrteam:tNi(S.orgTeam)+'先生',confidante:'閨中',smallschool:'小學',grinder:'努力',legend:'傳奇',yips:'失憶',distract:'外務',cancer:'氣氛',ambience:'氣氛',thief:'小倫'};Object.keys(TN).forEach(k=>{if(S.traits[k])tr.push(`<span class="tag">${TN[k]}</span>`)});card('','檔案',`隱藏：${tr.join(' ')||'無'}<br>薪：<b class="hl">${fM(MR(S.salary))}</b>`);choose('',[{t:'⚾ 新人生',main:true,f:()=>location.href=location.pathname},{t:'同種子',f:()=>location.href=location.pathname+'?seed='+SEED}])}
